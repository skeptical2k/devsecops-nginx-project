services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    user: root
    ports:
      - "8280:8080"

      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devsecopsnet

  nginx-app:
    build: .
    container_name: nginx-app
    ports:
      - "8088:80"
    networks:
      - devsecopsnet

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: nginx-exporter
    command:
      - "-nginx.scrape-uri=http://nginx-app/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      - nginx-app
    networks:
      - devsecopsnet

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nginx-exporter
    networks:
      - devsecopsnet

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - devsecopsnet

volumes:
  jenkins_home:

networks:
  devsecopsnet:
